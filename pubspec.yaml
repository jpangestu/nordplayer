name: nordplayer
description: "A highly customizable music player with extensive theming."
publish_to: "none"
version: 0.2.0-alpha+4

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.2.0
  path: ^1.9.1
  watcher: ^1.2.1

  flutter:
    sdk: flutter

  file_selector: ^1.1.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  material_ui: ^1.5.0
  path_provider: ^2.1.6

  # Mine
  typed_config: ^0.2.0
  app_resource_monitor:
    git: https://github.com/jpangestu/app_resource_monitor

  # Third parties
  flutter_riverpod: ^3.4.3
  lucide_icons_flutter: ^4.0.3
  win32: ^6.4.0

dependency_overrides:
  typed_config:
    path: ../typed_config

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/icons/window_control/kde_breeze/
    - assets/icons/window_control/windows11/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter/Inter_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_24pt-Bold.ttf
          weight: 700

    - family: jetbrains_mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
